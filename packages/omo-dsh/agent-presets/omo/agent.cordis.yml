# OMO for DSH — Agent-Plane composition (Batch A staging).
#
# 目标（docs/architecture/TARGET-ARCHITECTURE.md §4）：
#   单一 Preset 承载 sisyphus/hephaestus/prometheus/atlas 四个 Primary Role；
#   角色切换写入 Session Log 的 `omo/role` event 并用 role fold 读取，
#   绝不使用 agentPresets.recompose()。
#
# Batch A 阶段本文件只包含：
#   - OMO persona 占位（默认 Sisyphus 纪律，角色专属 section 由 E04 插件提供）
#   - 最小工具行（bash/fs/search/goal/todo/ask-user），全部来自宿主 registry
#   - 不发布任何 Service（因此不需要 isolate realm）
# 后续 Epic 会追加：role prompt sections、tool guard、routing middleware、
# continuation listener、context injection、compaction policy。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Sisyphus, the default primary role of OMO (Oh My OpenAgent) running on
      DeepSeek Harness. Model: {{model}}. Working directory: {{cwd}}.

      This is the Batch A staging persona. Operating discipline (verified OMO contracts):
      - Roles: sisyphus / hephaestus / prometheus / atlas share ONE session; the active
        role is the authority recorded in the session log as an `omo/role` event.
      - Never claim a role change from prompt text; only a parsed command or the
        start-work transition changes the role.
      - Small tasks run directly; real planning flows through Prometheus and hand off
        via /start-work before implementation.
      - Completion needs verifiable evidence; your own claim is not proof.
      - Role permissions are enforced by code, not by this prompt.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── Persistent PTY (E22 native-equivalent #4: interactive-bash-session) ──────
# terminal-bash registers the shell backend on ctx.terminals; tool-terminal
# exposes the six model-facing PTY tools (terminal_open & friends). Owner-scoped
# sessions replace upstream's tmux tracking; the reminder builder lives in
# compat/terminal.mjs.
# The pty family publishes `ctx.terminals` — a preset-owned service must sit
# behind an isolate realm with EVERY consumer in the same group (the mount
# rejects a service row outside one).
- id: pty-family
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: terminal-service
      name: /dsh/omo-plugin/terminal-service-row.mjs

    - id: terminal-bash
      name: /dsh/omo-plugin/terminal-bash-row.mjs

    - id: tool-terminal
      name: /dsh/omo-plugin/tool-terminal-row.mjs

# ── OMO role runtime (E04 first integration) ────────────────────────────────
# File-backed row resolved from this preset directory; registers omo_role and
# omo_role_status tools that append/fold `omo/role` session events.
- id: omo-role
  name: ./omo-role-plugin.mjs
